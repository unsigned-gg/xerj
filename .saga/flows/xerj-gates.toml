# Flow: xerj-gates
#
# Standard quality verification gates for XERJ workspace:
# rustfmt check, xtask hygiene, clippy (-D warnings, -j 2), workspace tests (-j 2),
# and Heimdal operator sign-off gate.

[flow]
name = "xerj-gates"
description = "Execute XERJ verification gates: fmt-check, hygiene, clippy (-D warnings, -j 2), cargo test (-j 2), and operator gate"

[params.package]
required = false
default = "xerj-common"
description = "Target crate package for focused test verification"

[[step]]
id = "fmt-check"
title = "Verify rustfmt formatting"
kind = "test"
agent = "auto"
verify_cmd = ["make", "fmt-check"]
prompt = """
Run `make fmt-check` across all crates in the engine workspace.
Ensure there are no formatting violations.
"""

[[step]]
id = "hygiene-check"
title = "Run toolchain, projectfile, stages, and workflow-timeout checks"
kind = "test"
agent = "auto"
deps = ["fmt-check"]
verify_cmd = ["make", "hygiene"]
prompt = """
Run `make hygiene`.
Ensure toolchain, projectfile.yaml, stages.rs, and workflow timeouts pass cleanly.
"""

[[step]]
id = "clippy-check"
title = "Run clippy linter with warnings denied (-j 2)"
kind = "test"
agent = "auto"
deps = ["hygiene-check"]
verify_cmd = ["make", "clippy"]
prompt = """
Run `make clippy` (-j 2, -D warnings).
Confirm the workspace passes without any warnings.
"""

[[step]]
id = "test-suite"
title = "Execute Cargo test suite (-j 2)"
kind = "test"
agent = "auto"
deps = ["clippy-check"]
verify_cmd = ["cargo", "test", "--manifest-path", "engine/Cargo.toml", "--locked", "-p", "{{params.package}}", "-j", "2"]
prompt = """
Run unit and integration test suites with mandatory host throttling:
`cargo test --manifest-path engine/Cargo.toml --locked -p {{params.package}} -j 2`
All tests must pass.
"""

[[step]]
id = "operator-gate"
title = "Operator sign-off gate"
kind = "gate"
gate = "heimdal:approval"
deps = ["test-suite"]
prompt = """
Review verification receipts (fmt-check, hygiene, clippy, tests).
Approve gate to permit PR landing or promotion.
"""
